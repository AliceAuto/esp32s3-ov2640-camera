; PlatformIO 工程 - ESP32-S3 + OV2640
; 目标: 从源码编译 esp32-camera, 解锁 JPEG 模式, 配合 UDP 实现高帧率/高分辨率传输
[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.mcu = esp32s3
board_build.arduino.memory_type = qio_opi
monitor_speed = 2000000
upload_port = COM7

; 从源码编译 esp32-camera (Arduino 预编译库在 JPEG 下出空帧 FB-OVF, 需源码编译绕过)
lib_deps =
    espressif/esp32-camera
    adafruit/Adafruit NeoPixel@^1.12.2
    tanakamasayuki/TensorFlowLite_ESP32

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=3
    ; 定焦镜头, 固定内存/优化
    -Os
    ; cam_task 固定到核1(与采集/控制 loop 同核)。默认 NO_AFFINITY 时, 切换分辨率
    ; deinit 跨核 vTaskDelete 与 cam_task 拷贝并发, 释放 cam_obj 时 use-after-free 卡死
    -DCONFIG_CAMERA_CORE1